name: Publish Package

# 受信发布（OIDC trusted publishing）：不需要任何长期 npm token，也不需要 6 位动态码。
# 已验证：2026-09-23 通过本工作流发布 dsh-aoci-panel@0.1.1，自动生成 npm provenance。
#
# npm 侧前置条件（在 https://www.npmjs.com/package/dsh-aoci-panel → Settings 配置一次）：
#   Provider         : GitHub Actions
#   Org or user      : donyue7
#   Repository       : dsh-aoci-panel
#   Workflow filename: publish.yml
#   Environment name : 留空
#   Allowed actions  : 必须勾选 "npm publish"（2026-09-03 之后的新配置默认只允许 npm stage publish）
#
# 两个已踩过的坑（改本文件时不要退回）：
#   1) setup-node 不要设 registry-url：它写入的空 `_authToken` 会顶掉 OIDC 鉴权，发布报 E404。
#   2) 本工作流需要 npm >= 11.5.1；setup-node 自带的 npm 版本较低，必须先升级。
#
# 发布方式：
#   1) 打 tag：git tag v0.1.2 && git push origin v0.1.2
#   2) 或在仓库 Actions 页面手动 Run workflow（workflow_dispatch）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 受信发布必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 准备工具链（受信发布需要 npm >= 11.5.1）
        run: |
          node -v
          npm install -g npm@^11
          npm -v

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-aoci-panel@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "dsh-aoci-panel@${VERSION} 已存在于 registry，跳过发布。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "准备发布 dsh-aoci-panel@${VERSION}"
          fi

      - name: 发布到 npm（OIDC 鉴权，自动生成 provenance）
        if: steps.check.outputs.skip != 'true'
        run: npm publish --loglevel verbose
