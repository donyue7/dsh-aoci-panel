name: Publish Package

# 受信发布（OIDC trusted publishing）：不需要任何长期 npm token，也不需要 6 位动态码。
#
# 前置条件（在 npmjs.com 上为 dsh-aoci-panel 配置一次 Trusted Publisher）：
#   Provider        : GitHub Actions
#   Org or user     : donyue7
#   Repository      : dsh-aoci-panel
#   Workflow filename: publish.yml
#   Allowed actions : 必须勾选 "npm publish"（2026-09-03 之后的新配置默认只允许 npm stage publish）
#   Environment name: 留空（若填写了，本工作流必须声明同名 environment）
#
# 发布方式：
#   1) 打 tag：git tag v0.1.2 && git push origin v0.1.2
#   2) 或在仓库 Actions 页面手动 Run workflow（workflow_dispatch）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 受信发布必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 注意：这里刻意不使用 setup-node 的 registry-url。
      # 它会写入含空 `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` 的 .npmrc，
      # 在没有 NODE_AUTH_TOKEN 的 OIDC 场景下会顶掉受信发布鉴权（表现为 publish 报 E404）。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 准备工具链（受信发布需要 npm >= 11.5.1）
        run: |
          node -v
          npm install -g npm@^11
          npm -v

      - name: 诊断 OIDC 环境并清理空 token
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- npmrc 内容（token 已脱敏）---"
            sed 's/\(_authToken=\).*/\1<redacted>/' "$NPM_CONFIG_USERCONFIG"
            echo "--- 移除 _authToken 行，强制走 OIDC ---"
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
            sed 's/\(_authToken=\).*/\1<redacted>/' "$NPM_CONFIG_USERCONFIG"
          fi
          echo "registry=$(npm config get registry)"

      - name: 检查该版本是否已发布
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-aoci-panel@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "dsh-aoci-panel@${VERSION} 已存在于 registry，跳过发布。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "准备发布 dsh-aoci-panel@${VERSION}"
          fi

      - name: 发布到 npm（OIDC 鉴权，自动生成 provenance）
        if: steps.check.outputs.skip != 'true'
        run: npm publish
